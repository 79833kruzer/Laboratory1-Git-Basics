spring.application.name=motion-studio
server.port=8080

# H2 database stored in ./data (survives restarts, ignored by git)
spring.datasource.url=jdbc:h2:file:./data/motionstudio
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# In-memory visitor sessions
studio.session.ttl=PT30M
studio.session.cleanup-interval=PT1M

# Request id from RequestLoggingFilter is added to every log line
logging.pattern.level=%5p [%8X{rid}]
logging.level.com.nazarkoldun.motionstudio=INFO
