<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Motion Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&family=Pacifico&family=Playfair+Display:ital,wght@0,600;1,600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
    <div class="brand" id="brand">Motion Studio</div>
    <nav class="tabs" id="tabs">
        <button class="tab active" data-view="studio">Studio</button>
        <button class="tab" data-view="presets">Presets</button>
        <button class="tab" data-view="gallery">Gallery</button>
    </nav>
    <div class="topbar-right">
        <button class="btn btn-glow" id="showcaseBtn">&#9654; Showcase</button>
        <div class="session-chip" id="sessionChip" title="Your session (in-memory, server side)">session …</div>
    </div>
</header>

<main id="main">
    <section class="view active" id="view-studio">
        <form class="panel editor" id="sceneForm" autocomplete="off">
            <div class="panel-head">
                <h2 id="editorTitle">New scene</h2>
                <span class="badge hidden" id="editingBadge"></span>
            </div>
            <label>Title
                <input name="title" maxlength="80" required placeholder="My first scene">
            </label>
            <label>Text
                <textarea name="text" rows="3" maxlength="300" required placeholder="Type something beautiful…">Make your words move</textarea>
            </label>
            <div class="row">
                <label>Font
                    <select name="font" id="fontSelect"></select>
                </label>
                <label><span>Size <output id="sizeOut">64</output> px</span>
                    <input type="range" name="fontSizePx" min="16" max="160" value="64">
                </label>
            </div>
            <div class="row">
                <label>Gradient from <input type="color" name="colorFrom" value="#f9a8d4"></label>
                <label>to <input type="color" name="colorTo" value="#a78bfa"></label>
            </div>
            <label>Animation preset
                <select name="presetId" id="presetSelect" required></select>
            </label>
            <p class="hint" id="presetHint"></p>
            <div class="actions">
                <button type="button" class="btn btn-primary" id="playBtn">&#9654; Play</button>
                <button type="submit" class="btn" id="saveBtn">Save as new</button>
                <button type="button" class="btn hidden" id="updateBtn">Update</button>
                <button type="button" class="btn btn-ghost" id="resetBtn">Clear</button>
            </div>
        </form>

        <div class="stage-wrap">
            <div class="stage" id="stage"></div>
            <div class="chip-row" id="presetChips"></div>
        </div>
    </section>

    <section class="view" id="view-presets">
        <div class="view-head">
            <h2>Animation presets</h2>
            <button class="btn btn-primary" id="newPresetBtn">+ New preset</button>
        </div>
        <div class="grid" id="presetGrid"></div>
    </section>

    <section class="view" id="view-gallery">
        <div class="view-head">
            <h2>Scene gallery</h2>
            <input type="search" id="searchInput" placeholder="Search scenes…">
        </div>
        <div class="recent hidden" id="recentRow"></div>
        <div class="grid" id="sceneGrid"></div>
    </section>
</main>

<dialog class="modal" id="presetDialog">
    <form id="presetForm" method="dialog" autocomplete="off">
        <h2 id="presetDialogTitle">New preset</h2>
        <div class="modal-body">
            <div class="modal-fields">
                <label>Name <input name="name" maxlength="60" required></label>
                <label>Effect <select name="effect" id="effectSelect"></select></label>
                <p class="hint" id="effectHint"></p>
                <label>Easing <select name="easing" id="easingSelect"></select></label>
                <div class="row">
                    <label>Duration (ms) <input type="number" name="durationMs" min="100" max="10000" value="800" required></label>
                    <label>Delay (ms) <input type="number" name="delayMs" min="0" max="5000" value="0" required></label>
                </div>
                <div class="row">
                    <label>Stagger (ms) <input type="number" name="staggerMs" min="0" max="1000" value="40" required></label>
                    <label>Repeat (0 = &infin;) <input type="number" name="iterations" min="0" max="20" value="1" required></label>
                </div>
            </div>
            <div class="mini-stage" id="presetPreview"></div>
        </div>
        <p class="form-error" id="presetError"></p>
        <div class="actions">
            <button type="button" class="btn btn-ghost" id="presetCancel">Cancel</button>
            <button type="submit" class="btn btn-primary">Save preset</button>
        </div>
    </form>
</dialog>

<div class="showcase hidden" id="showcase">
    <div class="showcase-stage" id="showcaseStage"></div>
    <div class="showcase-bar">
        <button class="btn btn-ghost" id="scPrev">&#8592;</button>
        <div class="showcase-dots" id="showcaseDots"></div>
        <button class="btn btn-ghost" id="scNext">&#8594;</button>
        <button class="btn btn-ghost" id="scClose">Close (Esc)</button>
    </div>
</div>

<div class="toasts" id="toasts"></div>

<script src="app.js"></script>
</body>
</html>
